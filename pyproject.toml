[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "apicli"
version = "0.1.0"
description = "A Postman/Bruno-style API testing TUI built with Python and Textual."
requires-python = ">=3.12"
dependencies = [
    "textual[syntax]>=8.2,<9",
    "httpx>=0.28",
]

[project.optional-dependencies]
test = ["pytest>=8"]
web = ["fastapi>=0.115", "uvicorn>=0.30"]
desktop = ["pywebview>=5.0", "fastapi>=0.115", "uvicorn>=0.30"]

[project.scripts]
apicli = "apicli.app:main"
apicli-web = "apicli.server.__main__:main"
apicli-desktop = "apicli.desktop:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]